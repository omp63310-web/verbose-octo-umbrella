*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef3f8;color:#222}
header{background:#e4002b;color:#fff;text-align:center;padding:25px 15px}
header h1{margin:0;font-size:34px}
header p{margin:8px 0 0;font-size:18px}
nav{background:#063b6d;display:flex;justify-content:center;flex-wrap:wrap;gap:4px}
nav a{color:#fff;text-decoration:none;padding:16px 13px;font-weight:bold;display:block}
nav a:hover{background:#0b568f}
.search-wrap{max-width:900px;margin:25px auto;padding:0 15px}
.search{display:flex;background:#fff;border:1px solid #ccc;border-radius:7px;overflow:hidden}
.search input{flex:1;border:0;padding:16px;font-size:17px;outline:0}
.search button{border:0;background:#e4002b;color:#fff;padding:0 28px;font-weight:bold;cursor:pointer}
.container{max-width:1200px;margin:auto;padding:0 15px 40px}
.updates{background:#fff;border-top:6px solid #ffb400;border-radius:10px;padding:20px 25px;margin-bottom:25px}
.updates h2{color:#e4002b;margin-top:0}
.update-list{margin:0;padding-left:22px}
.update-list li{margin:9px 0}
.update-list a{color:#075aa6}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px #0001}
.card h2{margin:0;background:#063b6d;color:#fff;padding:16px 20px;font-size:23px}
.items{padding:0}
.item{padding:16px 20px;border-bottom:1px solid #ddd}
.item:last-child{border-bottom:0}
.item-title{font-size:18px;font-weight:bold;line-height:1.35;margin-bottom:9px}
.item a.btn{display:inline-block;background:#075aa6;color:#fff;text-decoration:none;padding:9px 14px;border-radius:5px;font-weight:bold}
.item a.btn:hover{background:#e4002b}
.empty{padding:20px;color:#777}
footer{text-align:center;background:#063b6d;color:#fff;padding:20px;margin-top:20px}
@media(max-width:800px){
  header h1{font-size:27px}
  header p{font-size:15px}
  nav{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}
  nav a{white-space:nowrap;padding:13px 12px}
  .grid{grid-template-columns:1fr}
}
@media(max-width:500px){
  .search{display:flex}
  .search input{font-size:14px;padding:13px}
  .search button{padding:0 16px}
  .updates{padding:16px}
  .card h2{font-size:20px}
  .item{padding:14px}
}
</style>

function renderSections(data=siteData){
  const container=document.getElementById("sections");
  container.innerHTML="";
  Object.entries(data).forEach(([id,section])=>{
    const card=document.createElement("section");
    card.className="card";
    card.id=id;
    card.innerHTML=`<h2>${section.title}</h2><div class="items"></div>`;
    const items=card.querySelector(".items");

    section.items.forEach(([title,url])=>{
      const row=document.createElement("div");
      row.className="item";
      const safeUrl=url && url!=="#" ? url : "#";
      row.innerHTML=`
        <div class="item-title">${title}</div>
        <a class="btn" href="${safeUrl}" ${safeUrl!=="#"?'target="_blank" rel="noopener"':''}>
          ${section.title.includes("Result") ? "Check Result →" : "View Details →"}
        </a>`;
      items.appendChild(row);
    });
    container.appendChild(card);
  });
}

function renderUpdates(){
  const list=document.getElementById("updatesList");
  const all=[];
  Object.values(siteData).forEach(section=>{
    section.items.slice(0,2).forEach(item=>all.push(item));
  });
  list.innerHTML=all.slice(0,8).map(([title,url])=>{
    return `<li><a href="${url}" target="_blank" rel="noopener">${title}</a></li>`;
  }).join("");
}

function searchItems(){
  const q=document.getElementById("searchInput").value.trim().toLowerCase();
  if(!q){renderSections();return;}

  const filtered={};
  Object.entries(siteData).forEach(([id,section])=>{
    const matches=section.items.filter(([title])=>title.toLowerCase().includes(q));
    if(matches.length) filtered[id]={title:section.title,items:matches};
  });
  renderSections(filtered);
  document.getElementById("sections").scrollIntoView({behavior:"smooth"});
}

document.getElementById("searchInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") searchItems();
});

renderSections();
